<svg width="120" height="120" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Shield / Glowing Background -->
  <rect x="10" y="10" width="180" height="180" rx="36" fill="#0F172A" stroke="#1E293B" stroke-width="4"/>
  
  <!-- Subtle Hex Grid Backdrop -->
  <path d="M100 20 L160 55 L160 125 L100 160 L40 125 L40 55 Z" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <!-- Geometric Knight Silhouette -->
  <!-- Base of the Knight -->
  <path d="M55 150 H145 V160 C145 162.209 143.209 164 141 164 H59 C56.7909 164 55 162.209 55 160 V150 Z" fill="#38BDF8"/>
  <path d="M65 140 H135 L140 148 H60 L65 140 Z" fill="#0284C7"/>

  <!-- Body and Head of the Knight -->
  <path d="M70 140 
           C70 110, 60 95, 72 70 
           C80 50, 100 40, 125 42 
           C130 42, 138 46, 135 54 
           C132 62, 120 68, 128 78 
           C134 85, 142 88, 138 98 
           C134 108, 118 112, 115 120 
           C112 128, 125 135, 125 140 
           Z" 
        fill="url(#knight_gradient)" />

  <!-- Snout Cutout & Sharp Tactical Line (L-Shape Inset) -->
  <path d="M125 42 L95 65 L110 85 L85 105 L115 140" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI Eye (Glow Effect) -->
  <circle cx="105" cy="62" r="5" fill="#10B981"/>
  <circle cx="105" cy="62" r="9" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="knight_gradient" x1="60" y1="40" x2="140" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
</svg>
